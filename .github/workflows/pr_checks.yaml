name: PR & Quality Gate Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'deployment/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  static-analysis-and-golden-regression:
    name: Lint, Secret Scan, Unit Tests & Golden Regression Harness
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies from lockfile
        run: uv sync --frozen --extra lint

      - name: Run Ruff linter and formatting checks
        run: uv run ruff check app tests/unit tests/eval

      - name: Run Codespell check
        run: uv run codespell

      - name: Run deterministic unit tests & golden evaluation harness
        run: uv run pytest tests/unit -v

  cloud-integration-and-live-eval:
    name: Live GCP Integration & ADK Evaluation
    needs: static-analysis-and-golden-regression
    if: ${{ vars.CICD_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud via Workload Identity Federation'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and google-agents-cli
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --frozen --extra eval
          uv tool install google-agents-cli

      - name: Run live ADK integration tests
        env:
          GOOGLE_GENAI_USE_ENTERPRISE: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ vars.CICD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: us-central1
        run: uv run pytest tests/integration

      - name: Run Golden Dataset LLM-as-Judge Evaluation via agents-cli
        env:
          GOOGLE_GENAI_USE_ENTERPRISE: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ vars.CICD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: us-central1
        run: agents-cli eval run --config tests/eval/eval_config.yaml
